name: Publish Motrix WebExtension release

on:
  workflow_dispatch:
    inputs:
      run_lint:
        description: Run ESLint before packaging
        type: boolean
        default: true
      draft:
        description: Create as draft release
        type: boolean
        default: false
      prerelease:
        description: Mark as prerelease
        type: boolean
        default: false
      release_notes:
        description: Optional custom release notes
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: inputs.run_lint
        run: pnpm exec eslint src wxt.config.ts --quiet

      - name: Build Chrome and Firefox
        run: |
          pnpm build
          pnpm exec wxt build -b firefox

      - name: Package requested folder structure
        run: scripts/package-release.sh

      - name: Resolve version and release tag
        id: artifact
        run: |
          set -euo pipefail
          VERSION_NAME=$(jq -r .version .output/chrome-mv3/manifest.json)
          MANIFEST_VERSION="$VERSION_NAME"
          TAG="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "manifest_version=${MANIFEST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          {
            if [ -n "${{ inputs.release_notes }}" ]; then
              printf '%s\n\n' "${{ inputs.release_notes }}"
            fi
            printf '%s\n' \
              '## Package layout' \
              '' \
              'The combined archive contains:' \
              '' \
              'Motrix WebExtension/Motrix WebExtension/Chrome' \
              'Motrix WebExtension/Motrix WebExtension/Firefox' \
              '' \
              'Load the Chrome directory from chrome://extensions or the Firefox directory from about:debugging.' \
              '' \
              '## Build info' \
              '' \
              "- Manifest version: ${{ steps.artifact.outputs.manifest_version }}" \
              "- Manifest version_name: ${{ steps.artifact.outputs.version_name }}" \
              "- Commit: ${{ github.sha }}"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          name: Motrix WebExtension ${{ steps.artifact.outputs.version_name }}
          body_path: release-notes.md
          files: packages/Motrix WebExtension.zip
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          append_body: true
